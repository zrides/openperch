name: kiwibit-hub

services:
  hub:
    build: .
    image: kiwibit-hub:dev
    ports:
      # Localhost only by default. Set KIWIBIT_HUB_BIND=0.0.0.0 in .env to reach it from your phone.
      - "${KIWIBIT_HUB_BIND:-127.0.0.1}:${KIWIBIT_HUB_PORT:-8765}:8000"
      # Live video to browsers (WebRTC). Host and container port must match:
      # browsers are told to connect to this exact port. It listens on all
      # interfaces because some browsers (Firefox) won't use a 127.0.0.1 route.
      # Media is DTLS-SRTP encrypted and a browser needs the session keys that
      # only the password-protected API hands out.
      - "${KIWIBIT_LIVE_BIND:-0.0.0.0}:${KIWIBIT_LIVE_UDP_PORT:-8766}:${KIWIBIT_LIVE_UDP_PORT:-8766}/udp"
    environment:
      KIWIBIT_HUB_USER: ${KIWIBIT_HUB_USER:-kiwibit}
      KIWIBIT_HUB_PASSWORD: ${KIWIBIT_HUB_PASSWORD:?Set KIWIBIT_HUB_PASSWORD in .env}
      KIWIBIT_LIVE_UDP_PORT: ${KIWIBIT_LIVE_UDP_PORT:-8766}
      # Addresses browsers use to reach this machine: its LAN address (needed
      # by Firefox and by phones), then 127.0.0.1, e.g. 192.168.1.20,127.0.0.1
      KIWIBIT_LIVE_HOSTS: ${KIWIBIT_LIVE_HOSTS:-127.0.0.1}
      # Seconds without a job before the AI models' GPU memory is freed (0 = right after each job).
      KIWIBIT_GPU_IDLE_SECONDS: ${KIWIBIT_GPU_IDLE_SECONDS:-300}
    volumes:
      - ${KIWIBIT_DATA_DIR:-./data}:/data
      - ${KIWIBIT_BIOCLIP_DIR:-../bioclip-2.5-vith14}:/models/bioclip:ro
    secrets:
      - kiwibit_account
    gpus: all
    restart: unless-stopped

secrets:
  # The Kiwibit account token. Mounted read-only; never copied into the image or data.
  kiwibit_account:
    file: ${KIWIBIT_ACCOUNT_CONFIG:-../kiwibit-analysis/kiwibit-viewer/config.json}
